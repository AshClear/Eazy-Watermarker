name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # 校验作业不需要 rlpycairo（Linux 上它要系统 cairo，容易装不上）
          pip install pillow svglib reportlab

      - name: Byte-compile sources
        run: python -m compileall -q src

      - name: Build web page
        run: python src/make_web.py

      - name: Check web build exists
        run: test -s build/web/index.html

      - name: CLI smoke test
        run: |
          python src/cli.py docs/demo.jpg -o build/out --quality 80
          test -s build/out/demo_wm.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web/index.html

  windows-exe:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow svglib reportlab rlpycairo pyinstaller

      - name: Self test (exercises the SVG logo path)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logos | Out-Null
          Copy-Item docs/test-logo.svg logos/nikon-wordmark.svg -Force
          python src/gui.py --selftest
          Remove-Item logos/nikon-wordmark.svg -Force

      - name: Build exe
        run: |
          python src/make_web.py
          python -m PyInstaller --onefile -w --name EazyWatermarker `
            --add-data "logos;logos" `
            --collect-all svglib --collect-all rlPyCairo `
            --exclude-module numpy --exclude-module scipy --exclude-module pandas `
            --exclude-module matplotlib --exclude-module cv2 `
            --distpath dist --workpath build/pyi --specpath build/pyi `
            src/gui.py

      - name: Zip web build
        run: Compress-Archive -Path build/web/index.html -DestinationPath dist/web.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EazyWatermarker.exe
            dist/web.zip
          generate_release_notes: true
          body: |
            ## 下载

            | 文件 | 说明 |
            |---|---|
            | `EazyWatermarker.exe` | Windows 免安装版（约 24 MB）。首次运行会在同目录生成 `logos\` |
            | `web.zip` | 解压后双击 `index.html`，浏览器里直接用，完全离线 |

            ## 关于品牌标志

            仓库**不附带**任何品牌标志（商标问题）。三种选择：

            1. 不下载 —— 自动用文字字标（SONY / Canon / FUJIFILM …），版式不变
            2. 跑脚本：`python src/fetch_logos.py --all`（或 `--source jsdelivr`，国内可直连）
            3. 自己把 SVG/PNG 放进 `logos\`，命名规则见 `logos/README.md`

            ## 快速上手

            双击 exe → 左侧加照片 → 右侧调白边/字号/标识 → 导出到原图旁 `framed\`。
